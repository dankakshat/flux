<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flux — Deep Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <span class="loader-word">flux</span>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- Background Layer -->
  <div class="bg-layer" id="bgLayer">
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
      <!-- Fallback: gradient shown when no video -->
    </video>
    <div class="bg-overlay" id="bgOverlay"></div>
  </div>

  <!-- Main App -->
  <div class="app" id="app">

    <!-- Header -->
    <header class="header" id="header">
      <div class="header-left">
        <span class="logo">flux</span>
        <span class="logo-tagline">deep work</span>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-panel="timer" aria-label="Timer">timer</button>
        <button class="nav-btn" data-panel="tasks" aria-label="Tasks">tasks</button>
        <button class="nav-btn" data-panel="stats" aria-label="Stats">stats</button>
      </nav>
      <div class="header-right">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="focusModeBtn" aria-label="Focus Mode" title="Focus Mode (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">

      <!-- ─── TIMER PANEL ─── -->
      <section class="panel active" id="panel-timer">
        <div class="timer-wrap">

          <!-- Mode Tabs -->
          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="work">Focus</button>
            <button class="mode-tab" data-mode="short">Short Break</button>
            <button class="mode-tab" data-mode="long">Long Break</button>
          </div>

          <!-- Circular Timer -->
          <div class="timer-ring-container" id="timerRingContainer">
            <svg class="timer-ring" viewBox="0 0 280 280" aria-hidden="true">
              <defs>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                  <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              <!-- Track -->
              <circle class="ring-track" cx="140" cy="140" r="120" />
              <!-- Progress -->
              <circle class="ring-progress" id="ringProgress" cx="140" cy="140" r="120"
                stroke-dasharray="753.98"
                stroke-dashoffset="0"
                filter="url(#glow)" />
            </svg>
            <div class="timer-face">
              <div class="timer-label" id="timerLabel">FOCUS</div>
              <div class="timer-display" id="timerDisplay">25:00</div>
              <div class="timer-session" id="timerSession">Session 1</div>
            </div>
          </div>

          <!-- Controls -->
          <div class="timer-controls">
            <button class="ctrl-btn ctrl-reset" id="resetBtn" aria-label="Reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="ctrl-btn ctrl-play" id="startBtn" aria-label="Start">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="ctrl-btn ctrl-skip" id="skipBtn" aria-label="Skip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5,4 15,12 5,20" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
          </div>

          <!-- Keyboard hint -->
          <p class="keyboard-hint"><kbd>Space</kbd> to start/pause &nbsp;·&nbsp; <kbd>F</kbd> focus mode</p>
        </div>
      </section>

      <!-- ─── TASKS PANEL ─── -->
      <section class="panel" id="panel-tasks">
        <div class="tasks-wrap glass-panel">
          <div class="tasks-header">
            <h2 class="section-title">Today's Tasks</h2>
            <span class="task-count" id="taskCount">0 remaining</span>
          </div>

          <div class="task-input-row">
            <input
              type="text"
              id="taskInput"
              class="task-input"
              placeholder="Add a task…"
              maxlength="100"
              autocomplete="off"
            />
            <button class="task-add-btn" id="taskAddBtn" aria-label="Add task">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>

          <ul class="task-list" id="taskList" role="list">
            <!-- Tasks injected by JS -->
          </ul>

          <div class="tasks-footer">
            <button class="ghost-btn" id="clearCompletedBtn">Clear completed</button>
          </div>
        </div>
      </section>

      <!-- ─── STATS PANEL ─── -->
      <section class="panel" id="panel-stats">
        <div class="stats-wrap">
          <div class="stats-grid">
            <div class="stat-card glass-panel">
              <div class="stat-value" id="statSessions">0</div>
              <div class="stat-label">Sessions Today</div>
            </div>
            <div class="stat-card glass-panel">
              <div class="stat-value" id="statMinutes">0</div>
              <div class="stat-label">Focus Minutes</div>
            </div>
            <div class="stat-card glass-panel">
              <div class="stat-value" id="statStreak">0</div>
              <div class="stat-label">Day Streak</div>
            </div>
            <div class="stat-card glass-panel">
              <div class="stat-value" id="statTasks">0</div>
              <div class="stat-label">Tasks Done</div>
            </div>
          </div>

          <div class="streak-bar glass-panel">
            <h3 class="streak-title">This Week</h3>
            <div class="week-grid" id="weekGrid">
              <!-- 7 day bubbles injected by JS -->
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Footer / Background Controls -->
    <footer class="footer" id="footer">
      <div class="bg-controls">
        <span class="bg-label">background</span>
        <button class="bg-btn active" id="bgVideoBtn" title="Video background">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="m10 12 5 3-5 3V12z" fill="currentColor"/><path d="M15 3h-2M9 3H7M12 3v4"/></svg>
        </button>
        <button class="bg-btn" id="bgGradientBtn" title="Gradient background">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" opacity=".4"/></svg>
        </button>
        <div class="bg-divider"></div>
        <span class="bg-label">dim</span>
        <input type="range" id="dimSlider" class="dim-slider" min="0" max="85" value="40" aria-label="Dim background" />
      </div>
    </footer>

  </div><!-- /app -->

  <!-- ─── SETTINGS MODAL ─── -->
  <div class="modal-backdrop hidden" id="settingsBackdrop">
    <div class="modal glass-panel" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="icon-btn" id="closeSettingsBtn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="settings-body">
        <div class="setting-group">
          <label class="setting-label">Focus Duration <span class="setting-unit">min</span></label>
          <input type="number" id="setFocus" class="setting-input" value="25" min="1" max="90" />
        </div>
        <div class="setting-group">
          <label class="setting-label">Short Break <span class="setting-unit">min</span></label>
          <input type="number" id="setShortBreak" class="setting-input" value="5" min="1" max="30" />
        </div>
        <div class="setting-group">
          <label class="setting-label">Long Break <span class="setting-unit">min</span></label>
          <input type="number" id="setLongBreak" class="setting-input" value="15" min="1" max="60" />
        </div>
        <div class="setting-group">
          <label class="setting-label">Long Break After</label>
          <input type="number" id="setLongBreakAfter" class="setting-input" value="4" min="2" max="10" />
        </div>
        <div class="setting-group setting-toggle-row">
          <label class="setting-label">Sound Notifications</label>
          <label class="toggle">
            <input type="checkbox" id="setSoundEnabled" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-group setting-toggle-row">
          <label class="setting-label">Auto-start Breaks</label>
          <label class="toggle">
            <input type="checkbox" id="setAutoBreak" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <button class="primary-btn" id="saveSettingsBtn">Save Changes</button>
    </div>
  </div>

  <!-- Focus Mode Exit Hint -->
  <div class="focus-hint hidden" id="focusHint">Press <kbd>F</kbd> or <kbd>Esc</kbd> to exit focus mode</div>

  <script src="script.js"></script>
</body>
</html>
